<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>น้ำขึ้นน้ำลง ชุมพร - gukgu</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Chart.js -->
    <script>
    // 1. Service Worker Registration
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }

    // 2. พิกัดปากน้ำชุมพร & API Key
    const LAT = 10.4394;
    const LON = 99.2483;
    
    // 🔑 วาง API Key ที่ก๊อปปี้มาลงในอัญประกาศ ' ' ด้านล่างนี้
    const API_KEY = '9c833b91-7980-40b8-a11b-4e880161f497';

    let tideChart;
    const dateInput = document.getElementById('dateInput');
    
    // ตั้งค่าวันที่เริ่มต้นเป็นวันนี้
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;

    // ระบบ Cache ข้อมูลเพื่อประหยัด Credits
    function getCachedData(dateStr) {
        const cached = localStorage.getItem(`tide_${dateStr}`);
        return cached ? JSON.parse(cached) : null;
    }

    function setCachedData(dateStr, data) {
        localStorage.setItem(`tide_${dateStr}`, JSON.stringify(data));
    }

    async function fetchTideData(selectedDate) {
        const eventsGrid = document.getElementById('eventsGrid');
        eventsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding: 20px;">กำลังโหลดข้อมูลตารางน้ำ...</div>';

        // เช็กว่าเคยดึงข้อมูลวันนี้นำมาบันทึกไว้ในเครื่องแล้วหรือยัง (เพื่อไม่ให้เสีย Credit)
        const localData = getCachedData(selectedDate);
        if (localData) {
            renderData(localData);
            return;
        }

        try {
            // ดึงข้อมูลผ่าน WorldTides API
            const response = await fetch(`https://www.worldtides.info/api/v3?extremes&date=${selectedDate}&lat=${LAT}&lon=${LON}&key=${API_KEY}`);
            const data = await response.json();

            if (data.extremes && data.extremes.length > 0) {
                // บันทึกลงเครื่อง
                setCachedData(selectedDate, data.extremes);
                renderData(data.extremes);
            } else {
                eventsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding: 20px;">ไม่พบข้อมูลของวันที่เลือก</div>';
                if (tideChart) tideChart.destroy();
            }
        } catch (error) {
            console.error('Error fetching tide data:', error);
            eventsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#ef4444; padding: 20px;">เกิดข้อผิดพลาดในการดึงข้อมูล (โปรดตรวจสอบ API Key)</div>';
        }
    }

    function renderData(extremes) {
        const eventsGrid = document.getElementById('eventsGrid');
        eventsGrid.innerHTML = '';

        const times = [];
        const heights = [];

        extremes.forEach(item => {
            const dateObj = new Date(item.date);
            const timeStr = dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
            const heightMeters = item.height.toFixed(1);
            const isHigh = item.type.toLowerCase().includes('high');

            times.push(timeStr);
            heights.push(heightMeters);

            const typeText = isHigh ? '🔼 น้ำขึ้นเต็มที่' : '🔽 น้ำลงเต็มที่';
            const cssClass = isHigh ? 'high' : 'low';

            eventsGrid.innerHTML += `
                <div class="event-item ${cssClass}">
                    <div class="event-label">${typeText}</div>
                    <div class="event-time">${timeStr} น.</div>
                    <div class="event-height">${heightMeters} ม.</div>
                </div>
            `;
        });

        if (tideChart) tideChart.destroy();

        const ctx = document.getElementById('tideChart').getContext('2d');
        tideChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: times,
                datasets: [{
                    data: heights,
                    borderColor: '#0284c7',
                    backgroundColor: 'rgba(2, 132, 199, 0.12)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 5,
                    pointBackgroundColor: '#0284c7'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { suggestedMin: 0 } }
            }
        });
    }

    // เมื่อเปลี่ยนวันที่ ให้เรียกข้อมูลใหม่
    dateInput.addEventListener('change', (e) => fetchTideData(e.target.value));

    // โหลดข้อมูลวันแรก
    fetchTideData(dateInput.value);
</script>

</body>
</html>
